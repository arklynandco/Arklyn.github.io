<html lang="en">
<head>

    <title>KB's Dictionary English sha Khasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 80px; }

        /* Header & Nav */
        header { background: #2563eb; color: white; padding: 10px 10px; display: flex; align-items: center; gap: 60px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .brand-box { width: 40px; height: 40px; border-radius: 50%; background: #1d4ed8; overflow: hidden; }
        .brand-box img { width: 100%; height: 100%; object-fit: cover; }
        nav { background: #3b8; padding: 7px 20px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-size: 15px; font-weight: 900; }
        nav a:hover { text-decoration: underline; }

        /* Main */
        main { max-width: 700px; margin: 15px auto; padding: 0 15px; }
        .search-box { background: white; padding: 15px; border-radius: 30px; border: 2px solid #e2e8f0; display: flex; gap: 7px; }
        input { flex: 1; padding: 8px; border: 5px solid #e2e8f0; border-radius: 15px; font-size: 14px; outline: none; }
        input:focus { border-color: #2563eb; }
        button { background: #2563eb; color: white; padding: 5px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }

        /* UI Elements */
        .hidden { display: none !important; }
        .card { background: white; border: 2px solid #e2e8f0; padding: 10px; border-radius: 15px; margin-top: 15px; }
        .loader { text-align: center; margin: 20px 0; }
        
        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 0 auto 10px; }

        /* Modal */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 60px; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 350px; }
        
        .result-card{
    position:relative;
    overflow:hidden;
}

/* Fixed KBA watermark */
.kba-watermark{
    position:absolute;
    top:7px;
    right:10px;
    font-size:14px;
    font-weight:bold;
    color:rgba(37,99,235,0.25);
    pointer-events:none;
}

/* Word watermark */
.word-watermark{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
    font-weight:bold;
    color:rgba(0,0,0,0.05);
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
}
    </style>
</head>

            if (callback) callback();
        }, 2000);
    }
}

function shouldShowInterstitial(count) {
    return (
        count === 5 ||
        count === 10 ||
        count === 20 ||
        count === 30 ||
        count === 40 ||
        count === 50
    );
}

function shouldShowRewarded(count) {
    return (
        count === 15 ||
        count === 30 ||
        count === 45 ||
        count === 60
    );
}

const cardThemes = [
    "#dbeafe",
    "#dcfce7",
    "#fef3c7",
    "#fee2e2",
    "#ede9fe",
    "#fce7f3",
    "#cffafe",
    "#f3f4f6"
];

function hideResults() {

    document.getElementById(
        'definitionBox'
    ).classList.add('hidden');

}
    function handleSearch() {

    const word =
        document.getElementById('wordInput')
        .value.trim().toLowerCase();

    if (!word) {
        alert("Sngewbha thoh ka kyntien.");
        return;
    }

    if (!firstSearchRewardAsked) {

        firstSearchRewardAsked = true;

        const wantReward = confirm(
            "Watch a rewarded ad before your first search?"
        );

        if (wantReward) {

            showRewardedAd(() => {
                executeSearch(word);
            });

            return;
        }
    }

    executeSearch(word);
}

function executeSearch(word) {

    searchCount++;

    if (shouldShowInterstitial(searchCount)) {
        showInterstitialAd();
    }

    if (shouldShowRewarded(searchCount)) {

        showRewardedAd(() => {
            continueSearch(word);
        });

        return;
    }

    continueSearch(word);
}

function shareApp() {

    showInterstitialAd();

    setTimeout(() => {

        const shareText =
`📚 KB's Dictionary English sha Khasi

Download now:
https://your-download-link.com

Learn Khasi and English easily!`;

        if (navigator.share) {

            navigator.share({
                title: "KB's Dictionary",
                text: shareText
            });

        } else {

            navigator.clipboard.writeText(shareText);

            alert("Share message copied to clipboard.");
        }

    }, 1000);
}

function isOnline() {
    return navigator.onLine;
}


async function continueSearch(word) {

    document.getElementById(
        'nativeAdContainer'
    ).classList.remove('hidden');

    const loader =
        document.getElementById('searchLoader');

    const defBox =
        document.getElementById('definitionBox');

    loader.classList.remove('hidden');
    defBox.classList.add('hidden');

    let definition = null;
    let example = null;

    // Try Firebase first
try {

    if (
        isOnline() &&
        window.db &&
        window.doc &&
        window.getDoc
    ) {

        const docRef =
            window.doc(
                window.db,
                "dictionary",
                word
            );

        const snap =
            await window.getDoc(docRef);

        if (snap.exists()) {

            definition =
                snap.data().definition;

            example =
                snap.data().example;
        }
    }

} catch (e) {

    console.log(
        "Firebase unavailable. Using local."
    );
}

// If Firebase didn't return anything,
// use localDictionary
if (!definition) {
    definition =
        localDictionary[word] ||
        "Khlem ïoh jingbatai.";

    example =
        secondaryExampleDatabase[word] ||
        "Khlem don Nongmuna.";
}

    loader.classList.add('hidden');

    document.getElementById(
        'htmlContentArea'
    ).innerHTML = definition;

    document.getElementById(
        'exampleText'
    ).innerText = example;

    const randomColor =
        cardThemes[
            Math.floor(
                Math.random() *
                cardThemes.length
            )
        ];

    defBox.style.backgroundColor =
        randomColor;

    document.getElementById(
        "wordWatermark"
    ).innerText =
        word.toUpperCase();

    defBox.classList.remove('hidden');
}
